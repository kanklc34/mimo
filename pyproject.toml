[project]
name = "mimo-kurye"
version = "0.1.0"
description = "Mimo Kurye backend skeleton"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "pydantic",
    "uvicorn",
    "ortools>=9.10",
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
